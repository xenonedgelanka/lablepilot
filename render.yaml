services:
  - type: web
    name: labelpilot
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
